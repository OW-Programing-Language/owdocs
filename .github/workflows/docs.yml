name: Documentation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check bilingual docs and links
        run: node scripts/validate-docs.js
      - name: Smoke-test the HTTP server
        run: node --test scripts/server.test.js
